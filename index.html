<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squishi Home Makeover</title>
<meta name="description" content="Fix up and decorate 20 wrecked houses, earning tokens by merging squishies.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff4ea;--ink:#4b3a55;--mut:#8a7a92;--pk:#ff6fa5;--pk2:#ffd9e8;--pu:#8b6cf6;--yl:#ffd166;--line:#f1dfd2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif}
body{min-height:100vh;padding-bottom:90px}
button{font-family:inherit}
svg text{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,244,234,.94);backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
.logo{flex:1;font-weight:700;font-size:19px;line-height:1.05}.logo small{display:block;font-weight:500;font-size:12px;color:var(--mut)}
.tok{background:#fff;border:2px solid var(--yl);border-radius:999px;padding:6px 14px;font-weight:700;font-size:18px;box-shadow:0 3px 0 #f2b84b;cursor:pointer;white-space:nowrap}
.tok.bump{animation:bump .45s}@keyframes bump{40%{transform:scale(1.25)}}
.icbtn{border:0;background:#fff;border-radius:12px;width:40px;height:40px;font-size:19px;box-shadow:0 3px 0 var(--line);cursor:pointer;flex:none;color:var(--ink)}
main{max-width:1100px;margin:0 auto;padding:14px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:center;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#fff;border-top:2px solid var(--line)}
nav button{flex:1;max-width:180px;border:0;background:transparent;border-radius:14px;padding:6px 4px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;font-size:13px}
nav button b{font-size:24px;font-weight:400}nav button.on{background:var(--pk2);color:var(--ink)}
.view{display:none}.view.on{display:block;animation:fade .25s}@keyframes fade{from{opacity:0;transform:translateY(6px)}}
h2{margin:0;font-size:22px}h3{margin:18px 0 8px;font-size:17px}
.btn{border:0;background:var(--pk);color:#fff;border-radius:16px;padding:12px 18px;font-weight:700;font-size:16px;box-shadow:0 4px 0 #d94f86;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #d94f86}.btn:disabled{background:#e6d6de;box-shadow:0 4px 0 #cdbdc6;cursor:default}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:12px}.btn.ghostbtn{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.bar{height:10px;background:#f0e2d8;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd166,#ff6fa5);border-radius:999px;transition:width .5s}
.hero{background:#fff;border:2px solid var(--line);border-radius:22px;padding:14px 16px;margin-bottom:14px;box-shadow:0 4px 0 var(--line)}.hero p{margin:4px 0 10px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.grid.g3{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:#fff;border:2px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 4px 0 var(--line);padding:0;text-align:left;cursor:pointer;color:inherit;transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.thumbw{position:relative;aspect-ratio:4/3;background:#eadfd6}.thumbw svg{display:block;width:100%;height:100%}
.card.locked .thumbw svg{filter:grayscale(1) brightness(.75)}
.mystery{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(160deg,#cfc3d6,#9d8fa8)}.mystery span{font-size:64px;filter:grayscale(1) brightness(.3);opacity:.55}
.lockov{position:absolute;inset:0;display:grid;place-items:center;font-size:44px}
.badge{position:absolute;top:8px;right:8px;background:#fff;border-radius:999px;padding:2px 8px;font-size:18px;box-shadow:0 2px 0 rgba(0,0,0,.1)}
.lvl{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.9);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.cbody{padding:10px 12px 12px}.ct{font-weight:700;font-size:17px}.cs{font-size:13px;color:var(--mut);margin:2px 0 8px}
.rhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}.rhead h2{flex:1}.rprog{font-weight:600;color:var(--mut);font-size:13px;text-align:right}
.roomgrid{display:grid;gap:14px}
@media(min-width:960px){.roomgrid{grid-template-columns:1.6fr 1fr;align-items:start}.roomgrid .side{max-height:calc(100vh - 170px);overflow:auto;padding-right:4px}}
.scenew{position:relative;border-radius:22px;overflow:hidden;border:3px solid #fff;box-shadow:0 6px 0 var(--line),0 10px 30px rgba(120,80,60,.15);background:#ddd}
svg.scene{display:block;width:100%;height:auto}
.tap{cursor:pointer}.tap:hover{filter:brightness(1.07)}
.hot{cursor:pointer}.hot .ring{fill:#ff7eb3;transform-box:fill-box;transform-origin:center;animation:ring 1.6s ease-out infinite}.hot.rep .ring{fill:#ffb347}.hot.edit .ring{display:none}
@keyframes ring{0%{transform:scale(.8);opacity:.75}100%{transform:scale(1.8);opacity:0}}
.hint{background:#fff;border:2px dashed #f3c6d9;border-radius:14px;padding:9px 12px;margin-top:10px;font-size:14px}
.nudge{display:flex;align-items:center;gap:10px;background:#efe7ff;border-radius:16px;padding:10px 12px;margin-top:10px;font-size:14px}.nudge div{flex:1}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.task{display:flex;align-items:center;gap:8px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 10px;cursor:pointer;color:inherit}
.task .ti{font-size:20px;flex:none}.task .tn{font-weight:600;font-size:14px;line-height:1.15}.task .tsub{font-size:12px;color:var(--mut)}
.task.done{background:#f3fff1;border-color:#cdeec6}.task.lock{opacity:.5;cursor:default}
.spark{position:absolute;pointer-events:none;width:0;height:0}.spark span{position:absolute;left:-12px;top:-12px;font-size:24px;animation:sp .9s ease-out forwards}
@keyframes sp{0%{transform:translate(0,0) scale(.3);opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1.3);opacity:0}}
.sheet{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;background:rgba(60,40,70,.35)}.sheet.on{display:flex}
.sbox{background:#fff;width:100%;max-width:820px;border-radius:24px 24px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));animation:up .25s;max-height:92vh;overflow:auto}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.shead{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}.shead>div{flex:1}.stitle{font-weight:700;font-size:20px}.ssub{font-size:13px;color:var(--mut)}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{border:3px solid var(--line);border-radius:18px;background:#fff;padding:6px;color:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .12s;min-width:0}
.opt:hover{transform:translateY(-2px);border-color:#ffc1d9}.opt.cur{border-color:#7bd389;background:#f3fff4}
.pv{width:100%;border-radius:12px;overflow:hidden;background:#eee}.pv svg{display:block;width:100%;height:auto}
.opt .on{font-weight:600;font-size:13px;text-align:center;line-height:1.15;min-height:2.3em;display:flex;align-items:center}
.price{font-weight:700;background:#fff3cc;border-radius:999px;padding:3px 10px;font-size:14px}.opt.poor .price{background:#ffe3e3;color:#c0392b}
.charm{font-size:11px;line-height:1}.bigic{font-size:52px;aspect-ratio:4/3;display:grid;place-items:center;width:100%;background:#fdf6ee;border-radius:12px}
.smsg{margin-top:12px;font-size:14px;text-align:center}.smsg .btn{margin-top:8px}
.mhead{display:flex;align-items:center;gap:10px;max-width:480px;margin:0 auto 10px}.mhead>div:first-child{flex:1}.msub{font-size:13px;color:var(--mut)}
.funm{text-align:center;font-size:12px;font-weight:600;background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px 8px}
.dots{display:flex;gap:4px;margin-top:3px}.dots i{width:13px;height:13px;border-radius:50%;background:#eadff0}.dots i.f{background:var(--pk)}
.board{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;padding:9px;background:linear-gradient(#ffe9f2,#efe6ff);border-radius:24px;border:3px solid #fff;box-shadow:0 6px 0 #ecd3e6;width:min(96vw,480px,calc((100vh - 330px)));min-width:290px;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none}
.cell{aspect-ratio:1;border-radius:14px;background:rgba(255,255,255,.6);display:grid;place-items:center;position:relative;cursor:pointer}
.cell.sel{background:#fff;box-shadow:0 0 0 3px var(--pk) inset}
.cell.pop{animation:popin .35s cubic-bezier(.3,1.6,.5,1)}.cell.merge{animation:mergeA .5s}.cell.squeeze{animation:sqz .32s}
@keyframes popin{0%{transform:scale(.2)}100%{transform:scale(1)}}@keyframes mergeA{0%{transform:scale(.5) rotate(-12deg)}60%{transform:scale(1.25) rotate(6deg)}100%{transform:scale(1)}}@keyframes sqz{40%{transform:scale(1.22,.74)}70%{transform:scale(.9,1.12)}}
.sq{width:94%;height:auto;display:block;pointer-events:none;overflow:visible;transform-origin:50% 88%;animation-delay:var(--d,0s)}
.a-jiggle{animation:jig 1.9s ease-in-out infinite}@keyframes jig{25%{transform:skewX(5deg) scaleY(.97)}75%{transform:skewX(-5deg) scaleY(1.02)}}
.a-bounce{animation:bnc 2.2s ease-in-out infinite}@keyframes bnc{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-6%) scale(.96,1.04)}55%{transform:translateY(0) scale(1.08,.92)}}
.a-roll{animation:rol 3s ease-in-out infinite}@keyframes rol{25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.a-slide{animation:sld 2.6s ease-in-out infinite}@keyframes sld{50%{transform:translateX(4%) skewX(-4deg)}}
.a-breathe{animation:brt 2.6s ease-in-out infinite}@keyframes brt{50%{transform:scale(1.06,.95)}}
.a-knead{animation:knd 2.4s ease-in-out infinite}@keyframes knd{30%{transform:scale(1.1,.88)}60%{transform:scale(.94,1.06)}}
.a-ooze{animation:ooz 2.8s ease-in-out infinite}@keyframes ooz{50%{transform:scaleY(1.05) translateY(-2%)}}
.a-hop{animation:hop 1.8s ease-in-out infinite}@keyframes hop{0%,60%,100%{transform:translateY(0)}75%{transform:translateY(-9%) scale(.95,1.05)}88%{transform:translateY(0) scale(1.06,.94)}}
.a-squish{animation:sqs 2.4s ease-in-out infinite}@keyframes sqs{50%{transform:scale(1.1,.9)}}
.a-sway{animation:swy 2.6s ease-in-out infinite}@keyframes swy{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.info{max-width:480px;margin:12px auto 0;background:#fff;border-radius:16px;padding:10px 12px;border:2px solid var(--line);min-height:60px;display:flex;align-items:center;gap:10px;font-size:14px}
.info .ib{flex:1}.isub{font-size:12px;color:var(--mut);margin-top:2px}.gain{color:#d98a00;font-weight:700}
.squish{display:block;margin:14px auto 0;font-weight:700;font-size:26px;color:#fff;border:0;border-radius:999px;padding:15px 44px;background:linear-gradient(180deg,#ff8dbb,#ff5c9a);box-shadow:0 6px 0 #d63f7d,0 10px 22px rgba(255,92,154,.3);cursor:pointer}
.squish:active{transform:translateY(4px) scale(.97);box-shadow:0 2px 0 #d63f7d}
.back2{text-align:center;margin-top:14px}
.float{position:fixed;z-index:60;pointer-events:none;font-weight:700;color:#e08a00;font-size:20px;text-shadow:0 2px 0 #fff,0 0 6px #fff;transform:translate(-50%,-50%);animation:floatup 1.1s forwards;white-space:nowrap}.float.big{font-size:30px;color:var(--pk)}
@keyframes floatup{to{transform:translate(-50%,-170%);opacity:0}}
.ghost{position:fixed;z-index:70;pointer-events:none;transform:translate(-50%,-50%) scale(1.15);animation:none!important}
.shake{animation:shake .4s}@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(60,40,70,.5);padding:14px}.modal.on{display:flex}
.mbox{background:#fff;border-radius:26px;padding:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto;text-align:center;animation:popin .3s cubic-bezier(.3,1.5,.5,1)}.mbox p{line-height:1.4}
.tut{text-align:left;display:grid;gap:10px;margin:12px 0 16px}.tut div{display:flex;gap:10px;align-items:flex-start;background:#fff8f2;border-radius:14px;padding:10px}.tut b.e{font-size:26px;font-weight:400;line-height:1}
.newfam{display:flex;align-items:center;gap:10px;background:#fff8f2;border-radius:16px;padding:8px 12px;margin:10px 0;text-align:left}.newfam .sq{width:70px;flex:none}
.funtitle{font-size:30px;font-weight:700;background:linear-gradient(90deg,#ff5c9a,#8b6cf6,#ffb703);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block;animation:wob 1.2s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-3deg) scale(1.06)}}
.slots{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0}
.slot{width:90px;height:90px;border-radius:20px;border:3px dashed #e4cde0;display:grid;place-items:center;font-size:28px;color:#d6bfd2;cursor:pointer;background:#fff9fc;padding:4px}.slot.full{border-style:solid;border-color:var(--pk)}.slot .sq{width:80%}
.plus{font-size:28px;font-weight:700;color:var(--pk)}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;max-height:38vh;overflow:auto;padding:6px 2px}
.pick{border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 4px 6px;font-size:11px;color:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;line-height:1.1}.pick .sq{width:68%}
.funbtns{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.arena{position:relative;height:220px;overflow:hidden}
.fighter{position:absolute;top:50%;left:50%;width:96px;height:96px;margin:-48px 0 0 -48px;display:grid;place-items:center;transition:transform .75s cubic-bezier(.6,-.4,.5,1.4),opacity .15s}.fighter .sq{width:100%}
.fighter.l{transform:translateX(calc(-1 * min(150px,30vw)))}.fighter.r{transform:translateX(min(150px,30vw))}
.arena.go .fighter.l{transform:translateX(-22px) rotate(18deg) scale(1.1,.85)}.arena.go .fighter.r{transform:translateX(22px) rotate(-18deg) scale(1.1,.85)}.arena.hit .fighter{opacity:0}
.boom{position:absolute;inset:0;display:grid;place-items:center;font-size:46px;font-weight:700;color:#ff5c9a;text-shadow:3px 3px 0 #ffd166;opacity:0;pointer-events:none}.arena.hit .boom{animation:boom .7s forwards}
@keyframes boom{0%{opacity:0;transform:scale(.3) rotate(-10deg)}40%{opacity:1;transform:scale(1.3) rotate(4deg)}100%{opacity:0;transform:scale(1.7)}}
.result{position:absolute;left:50%;top:50%;width:150px;height:190px;margin:-95px 0 0 -75px;display:grid;place-items:center;opacity:0;transform:scale(.2);transition:all .55s cubic-bezier(.3,1.6,.5,1)}.arena.show .result{opacity:1;transform:scale(1)}.result .sq{width:100%}
.hyinfo{opacity:0;transform:translateY(10px);transition:all .4s .2s}.hyinfo.on{opacity:1;transform:none}
.hyname{font-size:24px;font-weight:700;color:var(--pu);margin:2px 0 8px}.hyline{background:#fff8f2;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:14px;text-align:left}
.meter{height:14px;background:#f2e6ef;border-radius:999px;overflow:hidden;margin:4px 0 2px}.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd166,#ff5c9a,#8b6cf6);transition:width 1.3s ease-out}
.jack{font-weight:700;color:#e08a00}.bigemoji{font-size:64px;line-height:1;animation:wob 1.2s infinite}
.cf{position:fixed;top:-14px;width:10px;height:14px;z-index:95;pointer-events:none;border-radius:2px;animation:fall var(--t) linear forwards}@keyframes fall{to{transform:translate(var(--x),110vh) rotate(800deg)}}
#toast{position:fixed;left:50%;top:72px;transform:translate(-50%,-20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-weight:600;z-index:90;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center;font-size:15px}#toast.on{opacity:1;transform:translate(-50%,0)}
.fam{background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px}.fam.locked{opacity:.6}
.famh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.famh .fn{font-weight:700}.famh span{font-size:12px;color:var(--mut)}
.toggle{border:2px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink)}.toggle.on{background:#e9fbe9;border-color:#9fdc9f}
.tiers{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.tier{display:flex;flex-direction:column;align-items:center;font-size:11px;text-align:center;gap:4px;line-height:1.1}.tier .sq{width:80%}
.unk{width:62%;aspect-ratio:1;border-radius:40%;background:#eee3ea;display:grid;place-items:center;color:#c6b3c1;font-size:22px;margin:8px 0}
.hygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}.hyc{background:#fff;border:2px solid var(--line);border-radius:18px;padding:10px;text-align:center;font-size:12px}.hyc .sq{width:60%;margin:0 auto 6px}.hyc b{display:block;font-size:14px;color:var(--pu);margin-bottom:4px}
.empty{color:var(--mut);background:#fff;border:2px dashed var(--line);border-radius:16px;padding:14px;text-align:center}
.settings{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
</style>
</head>
<body>
<header>
  <div class="logo">Squishi Home Makeover<small>Fix it · Style it · Squish it</small></div>
  <div class="tok" id="tok" title="Your tokens">🪙 <span>0</span></div>
  <button class="icbtn" id="snd" aria-label="Sound on or off">🔊</button>
</header>
<main>
  <section class="view" id="v-map"></section>
  <section class="view" id="v-house"></section>
  <section class="view" id="v-area"></section>
  <section class="view" id="v-merge"></section>
  <section class="view" id="v-dex"></section>
</main>
<nav>
  <button data-v="map"><b>🗺️</b>Houses</button>
  <button data-v="merge"><b>🫧</b>Squishi Merge</button>
  <button data-v="dex"><b>📖</b>Collection</button>
</nav>
<div class="sheet" id="sheet"><div class="sbox" id="sbox"></div></div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>
<script>
'use strict';
/* ===== utilities ===== */
const $=s=>document.querySelector(s);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
let U=0;const uid=()=>'q'+(U++).toString(36);
function hex2rgb(h){h=String(h).replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255]}
function rgb2hex(r,g,b){return'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}
function shade(h,a){const[r,g,b]=hex2rgb(h),t=a<0?0:255,p=Math.abs(a);return rgb2hex(r+(t-r)*p,g+(t-g)*p,b+(t-b)*p)}
function mix(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return rgb2hex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t)}
const F=n=>Math.round(n*10)/10;
const pts=a=>a.map(p=>F(p[0])+','+F(p[1])).join(' ');
const PG=(a,f,x)=>`<polygon points="${pts(a)}" fill="${f}"${x?' '+x:''}/>`;
const RC=(x,y,w,h,f,x2)=>`<rect x="${F(x)}" y="${F(y)}" width="${F(Math.max(0,w))}" height="${F(Math.max(0,h))}" fill="${f}"${x2?' '+x2:''}/>`;
const EL=(cx,cy,rx,ry,f,x2)=>`<ellipse cx="${F(cx)}" cy="${F(cy)}" rx="${F(Math.abs(rx))}" ry="${F(Math.abs(ry))}" fill="${f}"${x2?' '+x2:''}/>`;
const CI=(cx,cy,r,f,x2)=>`<circle cx="${F(cx)}" cy="${F(cy)}" r="${F(Math.abs(r))}" fill="${f}"${x2?' '+x2:''}/>`;
const LN=(a,b,c,w,x2)=>`<path d="M${F(a[0])} ${F(a[1])}L${F(b[0])} ${F(b[1])}" stroke="${c}" stroke-width="${w}"${x2?' '+x2:''}/>`;
function srand(seed){let s=Math.abs(Math.floor(seed*7919))%233280||7;return()=>{s=(s*9301+49297)%233280;return s/233280}}

/* ===== render context: collects defs (gradients, filters, patterns) ===== */
function Ctx(lite){
  const c={id:uid(),defs:[],lite:!!lite,cache:{}};
  c.g=(key,body)=>{if(c.cache[key])return c.cache[key];const i=uid();c.cache[key]=i;c.defs.push(body.replace(/\$ID/g,i));return i};
  const stops=cols=>cols.map(s=>`<stop offset="${s[0]}" stop-color="${s[1]}"${s[2]!=null?` stop-opacity="${s[2]}"`:''}/>`).join('');
  c.lin=(cols,x2=0,y2=1)=>'url(#'+c.g('L'+x2+'|'+y2+'|'+cols.join(';'),`<linearGradient id="$ID" x1="0" y1="0" x2="${x2}" y2="${y2}">${stops(cols)}</linearGradient>`)+')';
  c.rad=(cols,cx=.5,cy=.5,r=.5)=>'url(#'+c.g('R'+cx+'|'+cy+'|'+r+'|'+cols.join(';'),`<radialGradient id="$ID" cx="${cx}" cy="${cy}" r="${r}">${stops(cols)}</radialGradient>`)+')';
  c.blur=n=>c.lite?'':`filter="url(#${c.g('B'+n,`<filter id="$ID" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${n}"/></filter>`)})"`;
  c.pat=(key,w,h,body)=>'url(#'+c.g('P'+key,`<pattern id="$ID" patternUnits="userSpaceOnUse" width="${F(w)}" height="${F(h)}">${body}</pattern>`)+')';
  c.clip=(key,body)=>c.g('C'+key,`<clipPath id="$ID">${body}</clipPath>`);
  c.noise=(op=.07)=>c.lite?'':`<rect width="800" height="600" opacity="${op}" filter="url(#${c.g('N',`<filter id="$ID" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="4"/><feColorMatrix type="saturate" values="0"/></filter>`)})" style="mix-blend-mode:multiply" pointer-events="none"/>`;
  c.wrap=(inner,vb='0 0 800 600',cls='scene')=>`<svg viewBox="${vb}" class="${cls}" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><defs>${c.defs.join('')}</defs>${inner}</svg>`;
  return c;
}

function ridge(y0,amp,seed,step=14){let d=`M-10 620L-10 ${F(y0)}`;for(let x=-10;x<=810;x+=step){const y=y0-amp*(Math.sin(x/97+seed)*.5+Math.sin(x/41+seed*2.3)*.22+Math.sin(x/233+seed*3.1)*.6)/1.32;d+=`L${x} ${F(y)}`}return d+'L810 620Z'}
function peakPts(y0,amp,seed,n){const r=srand(seed);const p=[[-20,y0]];for(let i=0;i<n;i++){const x=-20+(i+.5)*840/n+(r()-.5)*40;p.push([x,y0-amp*(.55+r()*.45)]);p.push([x+420/n,y0-amp*(.12+r()*.25)])}p.push([820,y0]);return p}

  dunes(ctx,S,gy){let s='';for(let i=0;i<3;i++){const y=gy-70+i*26;s+=`<path d="${ridge(y,40-i*8,1+i*1.7,20)}" fill="${S.fc[i]}"/><path d="${ridge(y+6,30-i*6,1.3+i*1.7,20)}" fill="${shade(S.fc[i],-.12)}" opacity=".5"/>`}return s},

  skyline(ctx,S,gy){let s='';const r=srand(12);for(const [lay,col,base,hmax] of[[0,S.fc[0],gy-20,260],[1,S.fc[1],gy+10,200]]){let x=-10;while(x<820){const w=40+r()*60,h=60+r()*hmax;s+=RC(x,base-h,w,h+40,col);if(lay){for(let yy=base-h+10;yy<base;yy+=16)for(let xx=x+6;xx<x+w-8;xx+=12)if(r()>.35)s+=RC(xx,yy,6,8,'#ffe9b0','opacity=".55"')}else if(r()>.6)s+=RC(x+w/2-1,base-h-30,2,30,col);x+=w+4}}return s},
  reef(ctx,S,gy){let s='';for(let i=0;i<6;i++){const x=80+i*130;s+=`<path d="M${x} 0L${x+60} 0L${x+170} ${gy}L${x+90} ${gy}Z" fill="#bff3ff" opacity=".08"/>`}s+=`<path d="${ridge(gy-40,40,2)}" fill="${S.fc[1]}" opacity=".8"/>`;const r=srand(2);for(let i=0;i<16;i++){const x=r()*800,y=gy-10;s+=`<path d="M${F(x)} ${y}q${-8} -30 -2 -50M${F(x)} ${y}q8 -26 2 -44M${F(x)} ${y}q14 -18 16 -34" stroke="${i%3?S.fc[2]:'#ffb36b'}" stroke-width="5" fill="none" stroke-linecap="round" opacity=".8"/>`}for(let i=0;i<30;i++)s+=CI(r()*800,r()*gy,1+r()*3,'#fff','opacity=".35"');return s},
  craters(ctx,S,gy){let s=`<path d="${ridge(gy-40,40,2,20)}" fill="${S.fc[0]}"/><path d="${ridge(gy-10,20,5,20)}" fill="${S.fc[1]}"/>`;return s},
  deadhills(ctx,S,gy){let s=`<path d="${ridge(gy-70,45,3)}" fill="${S.fc[0]}"/><path d="${ridge(gy-30,30,6)}" fill="${S.fc[1]}"/>`;const r=srand(4);for(let i=0;i<6;i++){const x=40+r()*720,y=gy-30;s+=`<path d="M${F(x)} ${y}l2-40l-12-14M${F(x+2)} ${y-40}l10-16l8-4M${F(x+1)} ${y-24}l14-8" stroke="${S.fc[2]}" stroke-width="3" fill="none" stroke-linecap="round"/>`}return s+`<path d="${ridge(gy-6,14,8)}" fill="${S.fc[2]}"/>`},
  cloudsea(ctx,S,gy){let s='';s+=`<g opacity=".7"><path d="M90 230l30 0l-8 26l-12 4z" fill="#8a7a6a"/>${EL(105,228,22,6,'#7cc35a')}<path d="M650 180l40 0l-12 34l-14 6z" fill="#8a7a6a"/>${EL(670,178,28,7,'#7cc35a')}</g>`;const r=srand(7);for(let i=0;i<14;i++)s+=cloud(ctx,r()*820-10,gy+20+r()*80,1.4+r()*1.2,1,i%2?'#ffffff':'#eef2ff');return s}
};
function treeDots(y,c,seed){const r=srand(seed);let s='';for(let i=0;i<26;i++){const x=r()*800;s+=CI(x,y+r()*20,6+r()*6,shade(c,-.1))}return s}

const GROUND={
  grass(ctx,S,gy){let s=RC(0,gy,800,600-gy,ctx.lin([[0,S.gr[0]],[1,S.gr[1]]]));const r=srand(1);for(let i=0;i<220;i++){const y=gy+8+r()*(600-gy),x=r()*800,k=.4+(y-gy)/(600-gy);s+=`<path d="M${F(x)} ${F(y)}l${F(-2*k)} ${F(-7*k)}M${F(x+2*k)} ${F(y)}l${F(2*k)} ${F(-8*k)}" stroke="${shade(S.gr[1],-.15)}" stroke-width="${F(1.2*k)}" opacity=".6"/>`}return s},
  lawn(ctx,S,gy){let s=RC(0,gy,800,600-gy,ctx.lin([[0,S.gr[0]],[1,S.gr[1]]]));for(let i=0;i<8;i++){const x0=-200+i*150;s+=PG([[400+(x0-400)*.25,gy],[400+(x0+75-400)*.25,gy],[x0+75,600],[x0,600]],'#fff','opacity=".07"')}return s},
  sand(ctx,S,gy){let s=RC(0,gy,800,600-gy,ctx.lin([[0,S.gr[0]],[1,S.gr[1]]]));const r=srand(3);for(let i=0;i<40;i++){const y=gy+10+r()*(600-gy),x=r()*800,w=20+r()*60;s+=`<path d="M${F(x)} ${F(y)}q${F(w/2)} -5 ${F(w)} 0" stroke="${shade(S.gr[1],-.12)}" stroke-width="1.5" fill="none" opacity=".5"/>`}return s},
  snow(ctx,S,gy){let s=RC(0,gy,800,600-gy,ctx.lin([[0,S.gr[0]],[1,S.gr[1]]]));const r=srand(5);for(let i=0;i<14;i++){const y=gy+20+r()*(600-gy),x=r()*800;s+=EL(x,y,60+r()*80,6+r()*6,'#b9cfe4','opacity=".35"')}for(let i=0;i<60;i++)s+=CI(r()*800,gy+r()*(600-gy),1,'#fff');return s},
  water(ctx,S,gy){let s=RC(0,gy,800,600-gy,ctx.lin([[0,S.gr[0]],[1,S.gr[1]]]));const r=srand(6);for(let i=0;i<70;i++){const y=gy+6+r()*(600-gy),x=r()*800,k=(y-gy)/(600-gy);s+=`<path d="M${F(x)} ${F(y)}q${F(8+k*14)} -${F(3+k*3)} ${F(16+k*28)} 0" stroke="#fff" stroke-width="${F(1+k*1.5)}" fill="none" opacity="${F(.2+k*.3)}"/>`}return s},
  rock(ctx,S,gy){let s=RC(0,gy,800,600-gy,ctx.lin([[0,'#8c8a84'],[1,'#64625c']]))+`<path d="${ridge(gy+30,20,4,30)}" fill="${S.gr[0]}"/>`;const r=srand(9);for(let i=0;i<20;i++)s+=`<path d="M${F(r()*800)} ${F(gy+40+r()*140)}l${F(10+r()*20)} ${F(6+r()*10)}" stroke="#4a4842" stroke-width="2" opacity=".5"/>`;return s},
  dry(ctx,S,gy){let s=RC(0,gy,800,600-gy,ctx.lin([[0,S.gr[0]],[1,S.gr[1]]]));const r=srand(2);for(let i=0;i<260;i++){const y=gy+6+r()*(600-gy),x=r()*800,k=.4+(y-gy)/(600-gy);s+=`<path d="M${F(x)} ${F(y)}l${F(-3*k)} ${F(-9*k)}M${F(x)} ${F(y)}l${F(3*k)} ${F(-10*k)}" stroke="${i%2?'#a77f35':'#e8cf86'}" stroke-width="${F(1.1*k)}" opacity=".7"/>`}return s},
  moss(ctx,S,gy){let s=RC(0,gy,800,600-gy,ctx.lin([[0,S.gr[0]],[1,S.gr[1]]]));s+=`<path d="M-10 ${gy+60}Q400 ${gy+30} 810 ${gy+70}V${gy+140}Q400 ${gy+100} -10 ${gy+130}Z" fill="#e6e0d2"/>`;for(let i=0;i<5;i++)s+=`<path d="M-10 ${gy+70+i*12}Q400 ${gy+40+i*12} 810 ${gy+80+i*12}" stroke="#c9c1ae" fill="none" stroke-width="1.5"/>`;return s},
  roof(ctx,S,gy){let s=RC(0,gy,800,600-gy,ctx.lin([[0,S.gr[0]],[1,S.gr[1]]]));for(let i=-8;i<=8;i++)s+=LN([400+i*30,gy],[400+i*150,600],'#8f8a82',1.5);for(let y=gy+8,k=8;y<600;k*=1.25,y+=k)s+=LN([0,y],[800,y],'#8f8a82',1.2);return s},
  seabed(ctx,S,gy){let s=RC(0,gy,800,600-gy,ctx.lin([[0,S.gr[0]],[1,S.gr[1]]]));const r=srand(4);for(let i=0;i<24;i++)s+=EL(r()*800,gy+20+r()*(600-gy),6+r()*12,3+r()*4,'#a8946a','opacity=".6"');return s},
  moon(ctx,S,gy){let s=RC(0,gy,800,600-gy,ctx.lin([[0,S.gr[0]],[1,S.gr[1]]]));const r=srand(8);for(let i=0;i<16;i++){const x=r()*800,y=gy+20+r()*(600-gy-20),w=14+r()*40*(y-gy)/300;s+=EL(x,y,w,w*.28,'#6b6e7a')+EL(x,y-w*.06,w*.85,w*.2,'#8e909c')}return s},
  dead(ctx,S,gy){let s=RC(0,gy,800,600-gy,ctx.lin([[0,S.gr[0]],[1,S.gr[1]]]));const r=srand(5);for(let i=0;i<120;i++){const y=gy+6+r()*(600-gy),x=r()*800;s+=`<path d="M${F(x)} ${F(y)}l-2 -7M${F(x+2)} ${F(y)}l3 -6" stroke="#2c3322" stroke-width="1.2" opacity=".6"/>`}return s},
  none(ctx,S,gy){return''}
};
function sky(ctx,k,frac=1,gy=380){
  const S=SET[k];const gl=c=>mix(c,'#8c9198',(1-frac)*.55);let s=RC(0,0,800,600,ctx.lin([[0,gl(S.sky[0])],[1,gl(S.sky[1])]]));
  if(S.stars){const r=srand(3);for(let i=0;i<90;i++)s+=CI(r()*800,r()*gy*.9,r()*1.4+.3,'#fff',`opacity="${F(.4+r()*.6)}"`)}
  const sun=S.sun||'sun';
  if(sun==='sun')s+=`<circle cx="650" cy="90" r="110" fill="${ctx.rad([[0,'#fff6c8',.9*frac],[.35,'#ffe59a',.35*frac],[1,'#ffe59a',0]])}"/>${CI(650,90,32,mix('#fff4c2','#d8d8d8',1-frac))}`;
  if(sun==='moon')s+=`<circle cx="640" cy="100" r="90" fill="${ctx.rad([[0,'#fff6e0',.6],[1,'#fff6e0',0]])}"/>${CI(640,100,34,'#fbf3d9')}${CI(628,92,6,'#e6dcc0')}${CI(652,112,4,'#e6dcc0')}`;
  if(sun==='earth')s+=`${CI(630,110,46,ctx.rad([[0,'#5aa9ff'],[1,'#1b4f9c']],.35,.35,.7))}<path d="M605 95q15-12 28 2q-6 14 6 22q-18 8-30-6zM640 130q14-6 22 6q-10 10-20 2z" fill="#4caf50"/>${EL(625,85,18,5,'#fff','opacity=".7"')}${CI(630,110,52,'none','stroke="#9fd0ff" stroke-width="5" opacity=".3"')}`;
  if(S.clouds!==0){const r=srand(k.length);for(let i=0;i<4;i++)s+=cloud(ctx,60+r()*700,50+r()*120,.7+r()*.8,.9)}
  s+=FAR[S.far](ctx,S,gy);
  s+=GROUND[S.gt](ctx,S,gy);
  if(k==='ocean'){const r=srand(11);for(let i=0;i<14;i++)s+=CI(r()*800,r()*600,2+r()*5,'none','stroke="#e6fbff" stroke-width="1.2" opacity=".6"')}
  return s;
}

/* ===== Interior 3D room engine (one-point perspective, metres) ===== */
const RW=2,RH=3,RD=4,EYE=1.82;
const tz=z=>5.41/(9.41-z);
function P(x,y,z){const t=tz(z);return[400+200*x*t,236+(364-200*y)*t]}
function box(x0,x1,y0,y1,z0,z1,c,o={}){
  let s='';const f=(ps,col)=>{s+=`<polygon points="${pts(ps)}" fill="${col}"${o.r?` stroke="${col}" stroke-width="${o.r}" stroke-linejoin="round"`:''}${o.op!=null?` opacity="${o.op}"`:''}/>`};
  if(x0>0&&!o.noside)f([P(x0,y0,z0),P(x0,y1,z0),P(x0,y1,z1),P(x0,y0,z1)],o.sl||shade(c,-.1));
  if(x1<0&&!o.noside)f([P(x1,y0,z0),P(x1,y1,z0),P(x1,y1,z1),P(x1,y0,z1)],o.sr||shade(c,-.22));
  if(y1<EYE&&!o.notop)f([P(x0,y1,z0),P(x1,y1,z0),P(x1,y1,z1),P(x0,y1,z1)],o.top||shade(c,.1));
  if(y0>EYE)f([P(x0,y0,z0),P(x1,y0,z0),P(x1,y0,z1),P(x0,y0,z1)],shade(c,-.3));
  f([P(x0,y0,z1),P(x1,y0,z1),P(x1,y1,z1),P(x0,y1,z1)],o.front||c);
  return s}
const wq=(x0,x1,y0,y1,z=.004)=>[P(x0,y1,z),P(x1,y1,z),P(x1,y0,z),P(x0,y0,z)];
const fq=(x0,x1,z0,z1,y=.004)=>[P(x0,y,z0),P(x1,y,z0),P(x1,y,z1),P(x0,y,z1)];
function fell(cx,cz,rx,rz,y=.004,n=40){const a=[];for(let i=0;i<n;i++){const t=i/n*Math.PI*2;a.push(P(cx+rx*Math.cos(t),y,cz+rz*Math.sin(t)))}return a}
function shadowF(ctx,x0,x1,z0,z1,op=.32){return PG(fq(x0-.06,x1+.06,z0-.02,z1+.1,.002),'#000',`opacity="${ctx.lite?op*.5:op}" ${ctx.blur(5)}`)}
function cyl(ctx,x,z,r,y0,y1,c,o={}){const b=P(x,y0,z),t=P(x,y1,z),k=tz(z),rx=200*r*k;const ry=y=>rx*Math.min(.45,Math.max(.08,Math.abs(EYE-y)*.16));const g=ctx.lin([[0,shade(c,.12)],[.4,c],[1,shade(c,-.32)]],1,0);let s='';
  const yb=b[1],yt=t[1];const below=y1<EYE;
  s+=`<path d="M${F(b[0]-rx)} ${F(yt)}L${F(b[0]-rx)} ${F(yb)}A${F(rx)} ${F(ry(y0))} 0 0 0 ${F(b[0]+rx)} ${F(yb)}L${F(b[0]+rx)} ${F(yt)}${below?'':`A${F(rx)} ${F(ry(y1))} 0 0 1 ${F(b[0]-rx)} ${F(yt)}`}Z" fill="${g}"/>`;
  if(below&&!o.notop)s+=EL(t[0],yt,rx,ry(y1),o.top||shade(c,.15));
  return s}
function at(x,y,z,body){const p=P(x,y,z),k=tz(z);return`<g transform="translate(${F(p[0])} ${F(p[1])}) scale(${F(k*100)/100})">${body}</g>`}
const glowAt=(ctx,p,r,op=.5)=>ctx.lite?'':CI(p[0],p[1],r,ctx.rad([[0,'#fff4c4',op],[.5,'#ffe7a0',op*.35],[1,'#ffe7a0',0]]),'pointer-events="none"');

/* ---------- room shell ---------- */
function drawWalls(ctx,L,area){
  const c=L.wall,wr=L.wreck;let s='';
  const ceilC=wr?'#7f776c':mix(c,'#ffffff',.6);
  s+=PG([P(-RW,RH,0),P(RW,RH,0),P(RW,RH,RD),P(-RW,RH,RD)],ceilC);
  s+=PG([P(-RW,RH,0),P(RW,RH,0),P(RW,RH,RD),P(-RW,RH,RD)],ctx.lin([[0,'#000',0],[1,'#000',.18]]));
  const lw=[P(-RW,0,0),P(-RW,RH,0),P(-RW,RH,RD),P(-RW,0,RD)],rw=[P(RW,0,0),P(RW,RH,0),P(RW,RH,RD),P(RW,0,RD)];
  s+=PG(lw,shade(c,-.04))+PG(rw,shade(c,-.1));
  const b0=P(-RW,RH,0),b1=P(RW,0,0);
  s+=RC(b0[0],b0[1],b1[0]-b0[0],b1[1]-b0[1],pfill(ctx,L.wallP,c,.6));
  // perspective lines on side walls
  const lc=shade(c,-.22);const H=(y)=>LN(P(-RW,y,0),P(-RW,y,RD),lc,1.2)+LN(P(RW,y,0),P(RW,y,RD),lc,1.2);const V=(z,y0=0,y1=RH)=>LN(P(-RW,y0,z),P(-RW,y1,z),lc,1.2)+LN(P(RW,y0,z),P(RW,y1,z),lc,1.2);
  const wp=L.wallP;
  if(['logs','hplanks','siding'].includes(wp))for(let y=.15;y<RH;y+=wp==='logs'?.2:.16)s+=H(y);
  if(['brick','subway','tiles','ice','stone','metal'].includes(wp)){const st=wp==='tiles'?.3:wp==='metal'?.6:wp==='ice'?.3:.15;for(let y=st;y<RH;y+=st)s+=H(y);for(let z=.3;z<RD;z+=wp==='tiles'?.3:.5)s+=V(z)}
  if(['vplanks','bamboo','shoji','panels'].includes(wp))for(let z=.15;z<RD;z+=wp==='panels'?.6:.15)s+=V(z);
  if(wp==='stripes'||wp==='pinstripe')for(let z=.1;z<RD;z+=.1)s+=V(z);
  // wainscot
  if(L.v.wains&&!wr){const wc=L.wall2;s+=RC(b0[0],P(0,.95,0)[1],b1[0]-b0[0],b1[1]-P(0,.95,0)[1],pfill(ctx,'panels',wc,.5));
    s+=PG([P(-RW,0,0),P(-RW,.95,0),P(-RW,.95,RD),P(-RW,0,RD)],shade(wc,-.04))+PG([P(RW,0,0),P(RW,.95,0),P(RW,.95,RD),P(RW,0,RD)],shade(wc,-.1));
    s+=PG(wq(-RW,RW,.93,.98),shade(wc,.15))+PG([P(-RW,.93,0),P(-RW,.98,0),P(-RW,.98,RD),P(-RW,.93,RD)],shade(wc,.05))+PG([P(RW,.93,0),P(RW,.98,0),P(RW,.98,RD),P(RW,.93,RD)],shade(wc,-.05))}
  // ceiling style
  if(area.ceil==='beams'){for(let z=.3;z<RD;z+=.8)s+=box(-RW,RW,RH-.18,RH,z,z+.18,wr?'#5a4a3a':shade(L.wood,-.05),{noside:1})}
  if(area.ceil==='dome'||area.ceil==='curved'){const g=ctx.lin([[0,'#000',.25],[.4,'#000',0]],1,0),g2=ctx.lin([[.6,'#000',0],[1,'#000',.3]],1,0);s+=PG([P(-RW,RH,0),P(-RW,RH-.8,0),P(-RW,RH-.8,RD),P(-RW,RH,RD)],g)+PG([P(RW,RH,0),P(RW,RH-.8,0),P(RW,RH-.8,RD),P(RW,RH,RD)],g2)+`<path d="M${pts([P(-RW,RH-.6,0)])} Q${pts([P(0,RH+.3,0)])} ${pts([P(RW,RH-.6,0)])}" stroke="${shade(c,-.25)}" stroke-width="3" fill="none"/>`}
  if(area.ceil==='sloped'){s+=PG([P(-RW,RH,0),P(-RW,1.9,0),P(-RW,1.9,RD),P(-RW,RH,RD)],shade(c,-.15))+PG([P(RW,RH,0),P(RW,1.9,0),P(RW,1.9,RD),P(RW,RH,RD)],shade(c,-.2))+PG([P(-RW,RH,0),P(-RW,1.9,0),P(-1.2,RH,0)],shade(c,-.12))+PG([P(RW,RH,0),P(RW,1.9,0),P(1.2,RH,0)],shade(c,-.12))}
  // baseboards + crown
  const bb=wr?'#4e4439':L.trimI;s+=PG(wq(-RW,RW,0,.1,.006),bb)+PG([P(-RW,0,0),P(-RW,.1,0),P(-RW,.1,RD),P(-RW,0,RD)],shade(bb,-.08))+PG([P(RW,0,0),P(RW,.1,0),P(RW,.1,RD),P(RW,0,RD)],shade(bb,-.15));
  if(!area.ceil)s+=PG(wq(-RW,RW,RH-.07,RH,.006),shade(ceilC,-.05));
  // shading: side walls darker toward viewer, back wall corners
  s+=PG(lw,ctx.lin([[0,'#000',.28],[1,'#000',0]],1,0))+PG(rw,ctx.lin([[0,'#000',0],[1,'#000',.32]],1,0));
  s+=RC(b0[0],b0[1],b1[0]-b0[0],b1[1]-b0[1],ctx.rad([[0,'#fff',.12],[.7,'#fff',0],[1,'#000',.14]],.5,.45,.75));
  if(wr){const r=srand(3);for(let i=0;i<7;i++){const p=P(-1.8+r()*3.6,.4+r()*2.4,.004);s+=EL(p[0],p[1],20+r()*40,10+r()*24,'#5d5244',`opacity="${F(.18+r()*.2)}" ${ctx.blur(4)}`)}s+=`<path d="M${pts([P(-1.6,2.9,.01)])}l6 30l-8 22l10 34M${pts([P(1.3,2.9,.01)])}l-4 26l9 20" stroke="#4a4036" stroke-width="2" fill="none"/>`}
  return s}

function drawFloor(ctx,L){
  const c=L.floor,t=L.floorP,wr=L.wreck;let s=PG(fq(-RW,RW,0,RD,0),c);const r=srand(7);
  if(t==='planks'||t==='wide'){const pw=t==='wide'?.26:.17;for(let x=-RW;x<RW-1e-6;x+=pw){let z=-r()*1.4;while(z<RD){const z0=Math.max(0,z),z1=Math.min(RD,z+1.1+r()*1);s+=PG(fq(x,Math.min(RW,x+pw),z0,z1,0),shade(c,(r()-.5)*.16),`stroke="${shade(c,-.3)}" stroke-width=".7"`);z=z1}}}

function interiorScene(ctx,H,ai,st,opt={}){

  const items=A.items.filter(it=>it.k!=='wall'&&it.k!=='floor').slice().sort((a,b)=>itemZ(a)-itemZ(b));
  for(const it of items){const slot=it.slot||it.id;const ch=pick(slot);const tap=opt.hot&&rd?' class="tap"':'';
    if(ch!=null){const L0=H.looks[ch];const L=it.v?{...L0,v:{...L0.v,...it.v}}:L0;s+=`<g data-k="d:${slot}"${tap}>${K[it.k](ctx,it.p,L)}</g>`}
    else if(it.k==='window')s+=`<g data-k="d:${slot}"${tap}>${K.window(ctx,it.p,W0)}</g>`;
    else if(it.k==='light')s+=`<g data-k="d:${slot}"${tap}>${K.light(ctx,it.p,W0)}</g>`;
    else if(opt.hot&&rd&&!it.nohot)s+=`<g data-k="d:${slot}" class="tap">${itemGhost(it)}</g>`}

  weeds(ctx,R){const[y0,y1]=R.g;const r=srand(y0);let s='';for(let i=0;i<38;i++){const x=r()*800,y=y0+14+r()*(y1-y0-10),k=.6+(y-y0)/(y1-y0+1)*.8;s+=`<path d="M${F(x)} ${F(y)}q-6 -18 -16 -26M${F(x)} ${F(y)}q2 -24 -2 -36M${F(x)} ${F(y)}q8 -16 18 -22" stroke="${i%3?'#4f7d2a':'#8a9a3a'}" stroke-width="${F(3*k)}" fill="none" stroke-linecap="round"/>`;if(i%4===0)s+=CI(x-2,y-36*k,4*k,'#ffd84a')}return s},
  boards(ctx,R){return R.wins.map(([x,y,w,h])=>`<g fill="#a0784f" stroke="#6b4f33"><rect x="${x-8}" y="${y+h*.3}" width="${w+16}" height="10" transform="rotate(16 ${x+w/2} ${y+h*.35})"/><rect x="${x-8}" y="${y+h*.62}" width="${w+16}" height="10" transform="rotate(-13 ${x+w/2} ${y+h*.66})"/></g>`).join('')},
  roofholes(ctx,R){return R.roof.map(([x,y],i)=>`<path d="M${x-16} ${y}l8 -10 14 2 10 10 -6 10 -18 0z" fill="#1d1916"/><path d="M${x-10} ${y-4}v14M${x} ${y-6}v14" stroke="#6b4f33" stroke-width="2"/>`).join('')},
  branches(ctx,R){const[y0]=R.g;return[[120,y0+60],[560,y0+40],[300,y0+110]].map(([x,y])=>`<path d="M${x} ${y}l120 -14M${x+40} ${y-5}l-14 -22M${x+80} ${y-9}l18 -20" stroke="#5a4030" stroke-width="7" stroke-linecap="round"/>`+CI(x+30,y-26,10,'#7a8a3a')+CI(x+100,y-30,9,'#8a7a3a')).join('')},
  vines(ctx,R,c='#3f7d3a'){const[x,y,w,h]=R.fac;let s='';for(let i=0;i<5;i++){const sx=x+w*(.1+i*.2);let d=`M${sx} ${y+h}`;for(let k=0;k<5;k++)d+=`q${k%2?14:-14} ${-h/10} 0 ${-h/5}`;s+=`<path d="${d}" stroke="${c}" stroke-width="4" fill="none"/>`;for(let k=0;k<7;k++){const lx=sx+(k%2?10:-10),ly=y+h-k*h/7-8;s+=`<path d="M${F(lx)} ${F(ly)}q${k%2?10:-10} -8 ${k%2?18:-18} 2q${k%2?-8:8} 8 ${k%2?-18:18} -2z" fill="${shade(c,.25)}" stroke="${shade(c,-.2)}" stroke-width=".8"/>`}}return s},
  seaweed(ctx,R){return EROV.vines(ctx,R,'#5a7a2a')},
  drift(ctx,R,H){const c=H.drift||'#ffffff';const[y0,y1]=R.g;const[x,,w]=R.fac;return[[x-40,y0+10,120],[x+w-40,y0+6,140],[150,y0+70,160],[620,y0+80,150]].map(([cx,cy,r])=>EL(cx,cy,r,r*.25,c,ctx.blur(2))+EL(cx-10,cy-6,r*.7,r*.15,shade(c,.2))).join('')},
  splats(ctx,R){const[x,y,w,h]=R.fac;const r=srand(x+y);let s='';for(let i=0;i<9;i++){const cx=x+r()*w,cy=y+r()*h;s+=CI(cx,cy,7+r()*6,'#f5f5f0')+CI(cx+8,cy+5,3,'#f5f5f0')+`<path d="M${F(cx)} ${F(cy)}v${F(10+r()*10)}" stroke="#f5f5f0" stroke-width="3"/>`}return s},
  rust(ctx,R){const[x,y,w,h]=R.fac;const r=srand(x);let s='';for(let i=0;i<8;i++){const cx=x+r()*w,cy=y+r()*h;s+=EL(cx,cy,18+r()*24,10+r()*14,'#9a4a1a',`opacity=".55" ${ctx.blur(3)}`)+`<path d="M${F(cx)} ${F(cy)}v${F(20+r()*20)}" stroke="#8a3a12" stroke-width="2" opacity=".5"/>`}return s},
  barnacles(ctx,R){const[x,y,w,h]=R.fac;const r=srand(y);let s='';for(let i=0;i<60;i++)s+=CI(x+r()*w,y+r()*h,2+r()*4,i%2?'#bdb6a6':'#8f897c','stroke="#6b665c"');return s},
  junk(ctx,R){const[y0]=R.g;let s='';for(const[x,y]of[[120,y0+50],[600,y0+40],[220,y0+100]]){s+=EL(x,y,26,10,'#1d1d1d')+EL(x,y,12,5,'#555')+`<path d="M${x+30} ${y}h40v-30h-40z" fill="#c9a26b" stroke="#8a6a3a"/><path d="M${x+70} ${y}l18 -12v-30l-18 12z" fill="#a8854f"/>`+EL(x+110,y-6,20,14,'#3a3a3a')}return s},
  cracks(ctx,R){const[x,y,w,h]=R.fac;const z=(sx,sy,len)=>{let d=`M${sx} ${sy}`;for(let i=1;i<=6;i++)d+=`l${i%2?10:-7} ${F(len/6)}`;return`<path d="${d}" stroke="#2f2a24" stroke-width="2.5" fill="none" stroke-linejoin="round"/>`};return z(x+w*.15,y+10,h*.6)+z(x+w*.7,y+h*.2,h*.5)+z(x+w*.45,y+h*.5,h*.4)},
  cobweb(ctx,R){const[x,y,w]=R.fac;let s='';for(const[cx,dir]of[[x,1],[x+w,-1]]){let d='';for(let i=0;i<6;i++){const an=(dir>0?0:Math.PI)+dir*i*Math.PI/10;d+=`M${cx} ${y}l${F(Math.cos(an)*80)} ${F(Math.abs(Math.sin(an))*80)}`}for(let r=24;r<=80;r+=20){d+=`M${cx+dir*r} ${y}`;for(let i=1;i<6;i++){const an=(dir>0?0:Math.PI)+dir*i*Math.PI/10;d+=`L${F(cx+Math.cos(an)*r)} ${F(y+Math.abs(Math.sin(an))*r)}`}}s+=`<path d="${d}" stroke="#eee" stroke-width="1.2" fill="none" opacity=".9"/>`}return s}
};
function exteriorScene(ctx,H,ai,st,opt={}){const A=H.areas[ai],E=EXT[A.ext];const ov=opt.ov||{};const frac=A.reps.filter(r=>st.rep[r]!=null).length/A.reps.length;
  const S={};for(const id of S9){const ch=ov[id]!=null?ov[id]:st.dec[id];S[id]=ch!=null?H.looks[ch]:W0}
  let s=sky(ctx,E.set,frac,E.gy);s+=E.draw(ctx,S);s+=ctx.noise(.05);
  for(const rp of A.reps)if(st.rep[rp]==null)s+=`<g data-k="r:${rp}" class="${opt.hot?'tap':''}">${EROV[rp](ctx,E.reg,H)}</g>`;
  return s}

  HOUSES.forEach(H=>{if(!s.h[H.id])s.h[H.id]=f.h[H.id]});if(!Array.isArray(s.board)||s.board.length!==N)s.board=f.board;s.board=s.board.map(c=>c&&FAM[c.f]?c:null);s.fams=s.fams.filter(x=>FAM[x]);s.act=s.act.filter(x=>s.fams.includes(x));if(s.act.length<2)s.act=s.fams.slice(-5);return s}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
S=load();
const HS=hi=>S.h[HOUSES[hi].id];
const AS=(hi,ai)=>HS(hi).a[ai];
const tasksOf=A=>A.items.filter(it=>!it.slot);
const repDone=(hi,ai)=>HOUSES[hi].areas[ai].reps.every(r=>AS(hi,ai).rep[r]!=null);
const areaCount=(hi,ai)=>{const A=HOUSES[hi].areas[ai],st=AS(hi,ai);return A.reps.filter(r=>st.rep[r]!=null).length+tasksOf(A).filter(it=>st.dec[it.id]!=null).length};
const areaTotal=(hi,ai)=>{const A=HOUSES[hi].areas[ai];return A.reps.length+tasksOf(A).length};
const houseUnlocked=hi=>hi===0||HS(hi-1).done;
const areaUnlocked=(hi,ai)=>ai===0||repDone(hi,ai-1);
const housesDone=()=>HOUSES.filter(H=>S.h[H.id].done).length;
const lvl=()=>{let l=0;HOUSES.forEach((H,i)=>{if(houseUnlocked(i))l=i});return l};
const mult=()=>1+.12*lvl();
const r5=n=>Math.max(5,Math.round(n/5)*5);
const cost=(hi,ai,t,i)=>r5((t==='r'?[10,22,40]:[15,35,65])[i]*(1+hi*.12+ai*.04));
const luck=()=>Math.min(.3,.05+.02*housesDone());

/* ===== sound ===== */
let AC=null;
function ac(){if(AC===null){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=false}}if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}return AC}
function tone(f1,f2,dur,type='sine',vol=.2,delay=0){if(S.muted)return;const a=ac();if(!a)return;try{const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.03)}catch(e){}}
const sfx={pop:()=>tone(480,900,.12,'sine',.18),squish:()=>tone(260,110,.22,'triangle',.14),merge:t=>{tone(300+t*80,900+t*160,.18,'triangle',.2);tone(600+t*100,1250+t*200,.16,'sine',.12,.08)},coin:()=>{tone(988,988,.07,'square',.05);tone(1319,1319,.18,'square',.05,.07)},buy:()=>[660,880,1320].forEach((f,i)=>tone(f,f,.12,'triangle',.14,i*.07)),err:()=>tone(220,150,.2,'square',.07),splat:()=>{tone(200,40,.5,'sawtooth',.14);tone(900,180,.3,'square',.05)},fanfare:()=>[523,659,784,1047].forEach((f,i)=>tone(f,f,.2,'triangle',.15,i*.12))};

function updateTokens(b){const el=$('#tok');el.querySelector('span').textContent=S.tokens;if(b){el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}}

/* ===== scenes ===== */
const ERP_HOT=(E,t)=>{const R=E.reg;const fc=[R.fac[0]+R.fac[2]/2,R.fac[1]+R.fac[3]*.4];return{weeds:[90,(R.g[0]+R.g[1])/2+20],boards:[R.wins[0][0]+R.wins[0][2]/2,R.wins[0][1]+R.wins[0][3]/2],roofholes:R.roof[0],branches:[200,R.g[0]+60],drift:[720,R.g[0]+50],junk:[640,R.g[0]+30],vines:[R.fac[0]+25,R.fac[1]+R.fac[3]*.7],seaweed:[R.fac[0]+25,R.fac[1]+R.fac[3]*.7],rust:fc,splats:[fc[0]+40,fc[1]+20],barnacles:[fc[0]-60,fc[1]+10],cracks:[R.fac[0]+R.fac[2]*.75,R.fac[1]+R.fac[3]*.35],cobweb:[R.fac[0]+20,R.fac[1]+20]}[t]};
const IRP_HOT={junk:[0,.6,1.9],cobweb:[-1.7,2.7,0],cracks:[-1.3,2.3,0],puddle:[.2,0,2.4],peel:[-1.3,1.9,0],grime:[1.25,1.5,0],holes:[-1.1,0,2.6],sheets:[-.4,1.0,.8],drift:[.9,0,3.0],scribbles:[-.3,1.25,0],bats:[.3,2.4,1.2],vines:[1.7,2.3,.6]};
function hotHTML(x,y,ic,k,cls){return`<g class="hot ${cls}" data-k="${k}" transform="translate(${F(x)} ${F(y)})"><circle class="ring" r="24"/><circle r="19" fill="#fff" stroke="${cls==='rep'?'#ffa12e':cls==='edit'?'#bbb':'#ff7eb3'}" stroke-width="3"/><text y="1" font-size="19" text-anchor="middle" dominant-baseline="central">${ic}</text></g>`}
function areaHot(hi,ai,id){const H=HOUSES[hi],A=H.areas[ai];if(A.type==='ext')return EXT[A.ext].hot[id];const it=A.items.find(x=>x.id===id);if(id==='wall')return P(-1.55,2.55,0);if(id==='floor')return P(-1.55,0,3.55);return itemHot(it)}
function sceneHTML(hi,ai,o={}){const H=HOUSES[hi],A=H.areas[ai],st=AS(hi,ai);const ctx=Ctx(o.lite);ctx.set=H.set;
  let s=A.type==='ext'?exteriorScene(ctx,H,ai,st,o):interiorScene(ctx,H,ai,st,o);
  if(o.hot){const rd=repDone(hi,ai);
    for(const r of A.reps)if(st.rep[r]==null){const p=A.type==='ext'?ERP_HOT(EXT[A.ext],r):P(...IRP_HOT[r]);s+=hotHTML(p[0],p[1],'🔨','r:'+r,'rep')}
    if(rd)for(const it of tasksOf(A)){const p=areaHot(hi,ai,it.id);if(!p)continue;if(st.dec[it.id]==null)s+=hotHTML(p[0],p[1],'✨','d:'+it.id,'dec');else if(A.type==='ext')s+=`<g class="hot edit" data-k="d:${it.id}" transform="translate(${F(p[0])} ${F(p[1])}) scale(.6)"><circle r="19" fill="#fff" fill-opacity=".8" stroke="#bbb" stroke-width="3"/><text y="1" font-size="17" text-anchor="middle" dominant-baseline="central">✏️</text></g>`}}
  return ctx.wrap(s,o.vb||'0 0 800 600',o.cls||'scene')}
const thumbCache={};
function thumb(hi,ai){const key=HOUSES[hi].id+ai,st=JSON.stringify(AS(hi,ai));if(thumbCache[key]&&thumbCache[key].st===st)return thumbCache[key].svg;const svg=sceneHTML(hi,ai,{lite:true});thumbCache[key]={st,svg};return svg}

function renderMap(){const done=housesDone();const cards=HOUSES.map((H,hi)=>{const un=houseUnlocked(hi),hs=HS(hi);const c=H.areas.reduce((a,_,ai)=>a+areaCount(hi,ai),0),t=H.areas.reduce((a,_,ai)=>a+areaTotal(hi,ai),0);

  $('#v-map').innerHTML=`<div class="hero"><h2>🗺️ Your Houses</h2><p><b>${done}</b> of ${HOUSES.length} houses restored · ⭐ ${S.charm} style stars</p><div class="bar"><i style="width:${done/HOUSES.length*100}%"></i></div></div><div class="grid">${cards}</div>`}
/* ===== HOUSE view ===== */
function renderHouse(){const H=HOUSES[curH],hi=curH;const cards=H.areas.map((A,ai)=>{const un=areaUnlocked(hi,ai),c=areaCount(hi,ai),t=areaTotal(hi,ai),st=AS(hi,ai);
  const status=!un?`🔒 Fix up the ${H.areas[ai-1].name} first`:st.done?'⭐ Complete! Tap to restyle':!repDone(hi,ai)?'🔨 Needs repairs':'✨ Ready to decorate';

  $('#v-house').innerHTML=`<div class="rhead"><button class="icbtn" data-go="map" aria-label="Back">‹</button><h2>${H.ic} ${H.name}</h2><span class="rprog">Level ${hi+1}</span></div><div class="grid g3">${cards}</div>`}
/* ===== AREA view ===== */
function renderArea(){const hi=curH,ai=curA,H=HOUSES[hi],A=H.areas[ai],st=AS(hi,ai),rd=repDone(hi,ai);const tot=areaTotal(hi,ai),dn=areaCount(hi,ai);
  const pend=[...A.reps.filter(r=>st.rep[r]==null).map(()=>cost(hi,ai,'r',0)),...(rd?tasksOf(A).filter(it=>st.dec[it.id]==null).map(()=>cost(hi,ai,'d',0)):[])];const cheapest=pend.length?Math.min(...pend):Infinity;
  const chip=(t,id,n)=>{const done=t==='r'?st.rep[id]!=null:st.dec[id]!=null,lock=t==='d'&&!rd;const it=t==='d'&&A.items.find(x=>x.id===id);
    const sub=done?(t==='r'?'Fixed!':H.looks[st.dec[id]].name):lock?'Repairs first':`🪙 ${cost(hi,ai,t,0)}–${cost(hi,ai,t,2)}`;
    return`<button class="task${done?' done':''}${lock?' lock':''}" data-k="${t}:${id}" ${(t==='r'&&done)||lock?'disabled':''}><span class="ti">${done?'✅':lock?'🔒':t==='r'?'🔨':'✨'}</span><span><div class="tn">${n}</div><div class="tsub">${sub}</div></span></button>`};
  const hint=!rd?'🔨 Tap the <b>hammer</b> spots to clear the mess. Decorating unlocks after all repairs.':st.done?'⭐ Done! Tap anything to restyle — styles you own are free to swap.':'✨ Tap the <b>sparkle</b> spots (or the list) to choose a style. Every item has 3 choices.';
  $('#v-area').innerHTML=`<div class="rhead"><button class="icbtn" data-go="house" aria-label="Back">‹</button><h2>${A.name}</h2><span class="rprog">${H.name} · ${dn}/${tot}</span></div>
  <div class="roomgrid"><div><div class="scenew" id="scenew">${sceneHTML(hi,ai,{hot:true})}</div><div class="hint">${hint}</div>${S.tokens<cheapest&&pend.length?`<div class="nudge"><span style="font-size:26px">🫧</span><div>Need more tokens? Earn them by squishing!</div><button class="btn sm" data-go="merge">Squishi Merge</button></div>`:''}</div>
  <div class="side"><h3>🔨 Repairs</h3><div class="tasks">${A.reps.map(r=>chip('r',r,repName(r,H))).join('')}</div><h3>🎨 Decorate</h3><div class="tasks">${tasksOf(A).map(it=>chip('d',it.id,it.n)).join('')}</div></div></div>`}
function sparkleAt(p){const w=$('#scenew');if(!w||!p)return;const d=document.createElement('div');d.className='spark';d.style.left=(p[0]/8)+'%';d.style.top=(p[1]/6)+'%';let h='';for(let i=0;i<8;i++){const a=i/8*Math.PI*2;h+=`<span style="--x:${Math.cos(a)*60}px;--y:${Math.sin(a)*60}px">${i%2?'✨':'⭐'}</span>`}d.innerHTML=h;w.appendChild(d);setTimeout(()=>d.remove(),1000)}

/* ===== option sheet ===== */
let sheetK=null;
function openSheet(k){const hi=curH,ai=curA,A=HOUSES[hi].areas[ai],st=AS(hi,ai);const[t,id]=k.split(':');
  if(t==='d'&&!repDone(hi,ai)){toast('Fix all the 🔨 repairs first!');sfx.err();return}
  if(t==='r'&&st.rep[id]!=null)return;if(t==='d'&&!A.items.find(x=>x.id===id))return;
  sheetK=k;renderSheet();$('#sheet').classList.add('on')}
function previewVB(hi,ai,id){const A=HOUSES[hi].areas[ai];if(A.type==='int'&&(id==='wall'||id==='floor'))return'0 0 800 600';const p=areaHot(hi,ai,id)||[400,300];const w=A.type==='ext'?440:400,h=w*.75;let x=Math.max(0,Math.min(800-w,p[0]-w/2)),y=Math.max(0,Math.min(600-h,p[1]-h/2));return`${F(x)} ${F(y)} ${w} ${F(h)}`}
function renderSheet(){const hi=curH,ai=curA,H=HOUSES[hi],A=H.areas[ai],st=AS(hi,ai);const[t,id]=sheetK.split(':');
  let title,sub,cards;
  if(t==='r'){const R=REP[id];title='🔨 '+repName(id,H);sub='How do you want to fix it? Fancier fixes earn more ⭐ style stars.';
    cards=R.o.map((op,i)=>{const c=cost(hi,ai,t,i);return`<button class="opt${S.tokens<c?' poor':''}" data-i="${i}"><div class="bigic">${op[1]}</div><div class="on">${op[0]}</div><div class="charm">${'⭐'.repeat(i+1)}</div><div class="price">🪙 ${c}</div></button>`}).join('')}
  else{const it=A.items.find(x=>x.id===id);title='✨ '+it.n;sub='Pick a style — you can swap it any time.';const vb=previewVB(hi,ai,id);
    cards=H.looks.map((L,i)=>{const c=cost(hi,ai,t,i),cur=st.dec[id]===i,own=st.own[id]&&st.own[id][i];const ov={[id]:i};return`<button class="opt${cur?' cur':''}${!own&&!cur&&S.tokens<c?' poor':''}" data-i="${i}"><div class="pv">${sceneHTML(hi,ai,{lite:true,ov,vb,cls:'pvs'})}</div><div class="on">${L.name}</div><div class="charm">${'⭐'.repeat(i+1)}</div><div class="price">${cur?'✔ In use':own?'Owned · free':'🪙 '+c}</div></button>`}).join('')}
  $('#sbox').innerHTML=`<div class="shead"><div><div class="stitle">${title}</div><div class="ssub">${sub}</div></div><button class="icbtn" data-close aria-label="Close">✕</button></div><div class="opts">${cards}</div><div class="smsg" id="smsg"></div>`}
function choose(i){const hi=curH,ai=curA,H=HOUSES[hi],A=H.areas[ai],st=AS(hi,ai);const[t,id]=sheetK.split(':');const c=cost(hi,ai,t,i);
  if(t==='d'){if(st.dec[id]===i){closeSheet();return}st.own[id]=st.own[id]||[];if(!st.own[id][i]){if(S.tokens<c)return needMore(c);S.tokens-=c;st.own[id][i]=1;S.charm+=i+1}st.dec[id]=i}
  else{if(S.tokens<c)return needMore(c);S.tokens-=c;st.rep[id]=i;S.charm+=i+1;const o=REP[id].o[i];setTimeout(()=>toast(`${o[1]} ${o[2]}`,3200),150)}
  sfx.buy();save();closeSheet();renderArea();updateTokens(true);sparkleAt(t==='r'?(A.type==='ext'?ERP_HOT(EXT[A.ext],id):P(...IRP_HOT[id])):areaHot(hi,ai,id));checkComplete(hi,ai)}
function needMore(c){sfx.err();$('#smsg').innerHTML=`You need <b>${c-S.tokens}</b> more 🪙 for that one.<br><button class="btn sm" data-go="merge">🫧 Earn tokens in Squishi Merge</button>`;shake($('#sbox'))}
function checkComplete(hi,ai){const st=AS(hi,ai),H=HOUSES[hi];if(st.done||areaCount(hi,ai)<areaTotal(hi,ai))return;st.done=1;const bonus=r5(30*(1+hi*.15));S.tokens+=bonus;
  let msg='',big=false;const hs=HS(hi);
  if(H.areas.every((_,k)=>hs.a[k].done)&&!hs.done){hs.done=1;big=true;const hb=r5(100*(1+hi*.2));S.tokens+=hb;msg+=`<p><b>+${hb} 🪙</b> house bonus!</p>`;
    const nf=UNLOCK[hi];if(nf&&!S.fams.includes(nf)){S.fams.push(nf);S.act.push(nf);if(S.act.length>5)S.act.shift();msg+=`<div class="newfam">${sqSVG(nf,0)}<p>🆕 New squishy family: <b>${FAM[nf].n}</b>!</p></div>`}else msg+=`<p>🍀 <b>Lucky Squish!</b> More ★ squishies will pop out.</p>`;
    msg+=HOUSES[hi+1]?`<p>Next level unlocked: ${HOUSES[hi+1].ic} <b>${HOUSES[hi+1].name}</b>!</p>`:`<p>🏆 You restored ALL ${HOUSES.length} houses. Master Designer!</p>`}
  else{const nx=H.areas[ai+1];if(nx)msg+=`<p>Next: <b>${nx.name}</b></p>`}
  save();updateTokens(true);
  setTimeout(()=>{sfx.fanfare();confetti(big?90:50);showModal(`<div class="bigemoji">${big?'🏆':'⭐'}</div><h2>${big?H.name+' restored!':H.areas[ai].name+' complete!'}</h2><p><b>+${bonus} 🪙</b> bonus tokens</p>${msg}<button class="btn" data-closemodal>${big&&HOUSES[hi+1]?'Next house! 🎉':'Yay! 🎉'}</button>`);if(big&&HOUSES[hi+1])$('#mbox [data-closemodal]').dataset.nexthouse=hi+1},700)}

/* ===== MERGE ===== */
function renderMerge(){$('#v-merge').innerHTML=`<div class="mhead"><div><h2>🫧 Squishi Merge</h2><div class="msub">Match two of the same → a new squishy + tokens!</div></div><div class="funm" id="funm"></div></div><div class="board" id="board"></div><div class="info" id="info"></div><button class="squish" id="squishBtn">SQUISH! 🫧</button><div class="back2"><button class="btn ghostbtn" data-go="build">🏠 Spend tokens on the house</button></div>`;renderBoard()}
function renderBoard(){const el=$('#board');if(!el)return;el.innerHTML=S.board.map((c,i)=>`<div class="cell${sel===i?' sel':''}${fx&&fx.i===i?' '+fx.cls:''}" data-i="${i}" style="--d:-${(i*137)%2600}ms">${c?sqSVG(c.f,c.t):''}</div>`).join('');fx=null;renderInfo();$('#funm').innerHTML=`Fun Round<div class="dots">${[0,1,2,3,4].map(i=>`<i class="${i<S.fun?'f':''}"></i>`).join('')}</div>`}
const gain=t=>Math.round(VAL[t]*mult());
function renderInfo(){const el=$('#info');if(!el)return;
  if(sel!=null&&S.board[sel]){const c=S.board[sel],Fm=FAM[c.f],T=Fm.t[c.t];let nx;if(c.t<4){const N2=Fm.t[c.t+1],known=S.disc.includes(c.f+':'+(c.t+1));nx=`Match 2 → <b>${known?N2[0]:'❓ ???'}</b> <span class="gain">+${gain(c.t+1)}🪙</span>`}else nx=`Match 2 → <b>💥 MEGA SPLAT</b> <span class="gain">+${Math.round(MEGA*mult())}🪙</span>`;
    el.innerHTML=`<div class="ib"><b>${T[0]}</b><div class="isub">Level ${c.t+1} of 5 · ${nx}</div></div><button class="btn sm ghostbtn" id="squashBtn">Squash it<br><small>+1🪙</small></button>`}
  else{const empty=S.board.filter(x=>!x).length;el.innerHTML=empty?`<div class="ib">👆 Tap <b>SQUISH!</b> to pop out squishies. Drag (or tap one, then another) to put two matching ones together!</div>`:`<div class="ib">😱 Board full! Merge matching squishies, or tap one and <b>Squash it</b>.</div>`}}
function cellCenter(i){const c=document.querySelector(`.cell[data-i="${i}"]`);if(!c)return{x:innerWidth/2,y:innerHeight/2};const r=c.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
function floatAt(i,txt,big){const p=cellCenter(i),d=document.createElement('div');d.className='float'+(big?' big':'');d.textContent=txt;d.style.left=p.x+'px';d.style.top=p.y+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1200)}
function discover(f,t){const k=f+':'+t;if(S.disc.includes(k))return false;S.disc.push(k);return true}
function spawn(){const em=[];S.board.forEach((c,i)=>{if(!c)em.push(i)});if(!em.length){toast('Board full! Merge or squash a squishy 🫠');sfx.err();shake($('#board'));return}
  const i=rnd(em),f=rnd(S.act),t=Math.random()<luck()?1:0;S.board[i]={f,t};const isNew=discover(f,t);fx={i,cls:'pop'};sfx.pop();save();renderBoard();if(isNew)toast(`New squishy! <b>${FAM[f].t[t][0]}</b>`)}
function tap(i){const c=S.board[i];if(sel==null){if(c){sel=i;fx={i,cls:'squeeze'};sfx.squish()}renderBoard();return}if(sel===i){fx={i,cls:'squeeze'};sfx.squish();sel=null;renderBoard();return}tryMove(sel,i,false)}
function tryMove(a,b,drag){const A=S.board[a],B=S.board[b];if(!A){sel=null;renderBoard();return}
  if(!B){S.board[b]=A;S.board[a]=null;sel=null;fx={i:b,cls:'pop'};save();renderBoard();return}
  if(A.f===B.f&&A.t===B.t)return merge(a,b);
  if(drag){S.board[a]=B;S.board[b]=A;sel=null;fx={i:b,cls:'pop'};save()}else{sel=b;fx={i:b,cls:'squeeze'};sfx.squish()}renderBoard()}
function merge(a,b){const A=S.board[a];S.board[a]=null;let g,txt,big=false,isNew=false,nt=A.t+1;
  if(A.t>=4){S.board[b]=null;g=Math.round(MEGA*mult());txt=`MEGA SPLAT! +${g}🪙`;big=true}else{S.board[b]={f:A.f,t:nt};g=gain(nt);txt=`+${g}🪙`;isNew=discover(A.f,nt);fx={i:b,cls:'merge'}}
  S.tokens+=g;S.made++;S.fun++;sel=null;save();renderBoard();updateTokens(true);floatAt(b,txt,big);
  if(big){sfx.splat();shake($('#board'));confetti(40)}else{sfx.merge(nt);setTimeout(sfx.coin,150)}
  if(isNew)setTimeout(()=>toast(`✨ New squishy discovered: <b>${FAM[A.f].t[nt][0]}</b>!`),300);
  if(S.fun>=5){S.fun=0;save();setTimeout(()=>{renderBoard();openFun()},950)}}
function squash(){if(sel==null||!S.board[sel])return;const i=sel;S.board[i]=null;sel=null;S.tokens+=1;sfx.squish();save();renderBoard();floatAt(i,'+1🪙');updateTokens(true)}
let drag=null;
document.addEventListener('pointerdown',e=>{ac();const cell=e.target.closest&&e.target.closest('#board .cell');if(!cell)return;e.preventDefault();drag={i:+cell.dataset.i,x:e.clientX,y:e.clientY,moved:false,ghost:null,has:!!S.board[+cell.dataset.i]}});
document.addEventListener('pointermove',e=>{if(!drag||!drag.has)return;if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>10){drag.moved=true;const src=document.querySelector(`.cell[data-i="${drag.i}"] .sq`);if(src){const r=src.getBoundingClientRect(),g=src.cloneNode(true);g.classList.add('ghost');g.style.width=r.width+'px';g.style.height=r.height+'px';document.body.appendChild(g);drag.ghost=g;src.style.opacity=.3}}if(drag.ghost){drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px'}},{passive:true});
document.addEventListener('pointerup',e=>{if(!drag)return;const d=drag;drag=null;if(d.ghost)d.ghost.remove();if(d.moved){const el=document.elementFromPoint(e.clientX,e.clientY),cell=el&&el.closest('#board .cell');if(cell&&+cell.dataset.i!==d.i)tryMove(d.i,+cell.dataset.i,true);else renderBoard()}else tap(d.i)});
document.addEventListener('pointercancel',()=>{if(drag&&drag.ghost)drag.ghost.remove();drag=null;renderBoard()});

/* ===== FUN ROUND ===== */
let funPick=[null,null];
function openFun(){funPick=[null,null];sfx.fanfare();confetti(30);renderFun()}
function renderFun(){const keys=[...S.disc].sort((a,b)=>{const[fa,ta]=a.split(':'),[fb,tb]=b.split(':');return FAMKEYS.indexOf(fa)-FAMKEYS.indexOf(fb)||ta-tb});
  const slot=(k,i)=>k?`<button class="slot full" data-slot="${i}">${sqSVG(...(([f,t])=>[f,+t])(k.split(':')))}</button>`:`<button class="slot" data-slot="${i}">?</button>`;
  showModal(`<div class="funtitle">🎉 FUN ROUND! 🎉</div><p>Pick <b>ANY two</b> squishies and SMOOSH them into something ridiculous!</p><div class="slots">${slot(funPick[0],0)}<span class="plus">+</span>${slot(funPick[1],1)}</div><div class="picks">${keys.map(k=>{const[f,t]=k.split(':');return`<button class="pick" data-pk="${k}">${sqSVG(f,+t)}<span>${FAM[f].t[t][0]}</span></button>`}).join('')}</div><div class="funbtns"><button class="btn ghostbtn" id="funRand">🎲 Surprise me</button><button class="btn" id="funGo" ${funPick[0]&&funPick[1]?'':'disabled'}>SMOOSH! 💥</button></div>`)}
function makeHybrid(a,b){const A=FAM[a.f].t[a.t][0],B=FAM[b.f].t[b.t][0],wa=A.split(' '),wb=B.split(' '),na=wa[wa.length-1],nb=wb[wb.length-1];
  let port=na.slice(0,Math.ceil(na.length/2))+nb.slice(Math.floor(nb.length/2)).toLowerCase();if(port.toLowerCase()===na.toLowerCase())port=na+'-'+nb.toLowerCase();const first=wa.length>1?wa[0]:'Mega';
  const T=[()=>`${first} ${port}`,()=>`Sir ${port} the ${rnd(TITLES)}`,()=>`${port}zilla`,()=>`Lil' ${port}`,()=>`${port} McSquishface`,()=>`Captain ${port}`,()=>`${port}-o-saurus`,()=>`Professor ${port}`,()=>`The ${rnd(TITLES)} ${port}`,()=>`${port} Supreme Deluxe`,()=>`Baby ${wb[0]} ${port}`,()=>`${port} ${rnd(['3000','Jr.','the Third','XL','Turbo'])}`];
  const r=60+Math.floor(Math.random()*41);let tok=Math.round((12+(a.t+b.t)*6+Math.floor(Math.random()*12))*mult());if(r>=97)tok*=2;
  return{a,b,name:rnd(T)(),power:rnd(POWERS),warn:rnd(WARN),r,tok,sound:rnd(SOUNDS),eyes:Math.floor(Math.random()*3),mouth:Math.floor(Math.random()*4)}}
function smoosh(){const[a,b]=funPick.map(k=>{const[f,t]=k.split(':');return{f,t:+t}}),h=makeHybrid(a,b);S.hy.unshift(h);if(S.hy.length>80)S.hy.length=80;S.tokens+=h.tok;save();
  showModal(`<div class="arena" id="arena"><div class="fighter l">${sqSVG(a.f,a.t)}</div><div class="fighter r">${sqSVG(b.f,b.t)}</div><div class="boom">${h.sound}</div><div class="result">${hySVG(h)}</div></div><div class="hyinfo" id="hyinfo"><div class="ssub">Say hello to…</div><div class="hyname">${h.name}</div><div class="hyline">⚡ <b>Special power:</b> ${h.power}</div><div class="hyline">⚠️ <b>Warning:</b> ${h.warn}</div><div class="hyline"><b>Ridiculousness:</b> ${h.r}%<div class="meter"><i id="meter"></i></div>${h.r>=97?'<span class="jack">🎰 JACKPOT! Tokens doubled!</span>':''}</div><p><b>+${h.tok} 🪙</b> bonus tokens</p><button class="btn" data-closemodal>Keep squishing! 🫧</button></div>`);
  const ar=$('#arena');setTimeout(()=>ar.classList.add('go'),60);setTimeout(()=>{ar.classList.add('hit');sfx.splat();shake($('#mbox'))},820);
  setTimeout(()=>{ar.classList.add('show');$('#hyinfo').classList.add('on');sfx.fanfare();confetti(50);updateTokens(true);setTimeout(()=>{const m=$('#meter');if(m)m.style.width=h.r+'%'},100)},1250)}

/* ===== COLLECTION ===== */
function renderDex(){const fams=FAMKEYS.map(f=>{const Fm=FAM[f],un=S.fams.includes(f),act=S.act.includes(f);const hi=UNLOCK.indexOf(f);const n=Fm.t.filter((_,t)=>S.disc.includes(f+':'+t)).length;
    return`<div class="fam${un?'':' locked'}"><div class="famh"><span class="fn">${Fm.n}</span>${un?`<button class="toggle${act?' on':''}" data-fam="${f}">${act?'✔ In the mix':'＋ Add to mix'}</button>`:`<span>🔒 Restore the ${HOUSES[hi].name} to unlock</span>`}</div><div class="tiers">${Fm.t.map((T,t)=>S.disc.includes(f+':'+t)?`<div class="tier">${sqSVG(f,t)}<span>${T[0]}</span></div>`:`<div class="tier"><div class="unk">?</div><span>???</span></div>`).join('')}</div>${un?`<div class="isub">${n}/5 found</div>`:''}</div>`}).join('');
  const hy=S.hy.length?`<div class="hygrid">${S.hy.map(h=>`<div class="hyc">${hySVG(h)}<b>${h.name}</b>${h.power}</div>`).join('')}</div>`:`<div class="empty">No weird squishies yet. Every 5 merges you get a 🎉 Fun Round — smoosh any two together!</div>`;
  $('#v-dex').innerHTML=`<h2>📖 Squishidex</h2><p class="msub">Choose up to <b>5</b> families for the SQUISH button mix (fewer families = easier matches).</p>${fams}<h3>🤪 Weird Squishies (${S.hy.length})</h3>${hy}<div class="settings"><button class="btn ghostbtn" id="tutBtn">❓ How to play</button><button class="btn ghostbtn" id="resetBtn">🗑️ Start over</button></div>`}

/* ===== NAV ===== */
function go(v){if(v==='build')v=lastArea?'area':'map';view=v;sel=null;document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===(['house','area'].includes(v)?'map':v)));closeSheet();render();window.scrollTo(0,0)}
let lastArea=false;
function render(){if(view==='map'){lastArea=false;renderMap()}else if(view==='house'){lastArea=false;renderHouse()}else if(view==='area'){lastArea=true;renderArea()}else if(view==='merge')renderMerge();else renderDex();updateTokens()}
function tutorial(){showModal(`<div class="bigemoji">🏚️</div><h2>Welcome to Squishi Home Makeover!</h2><div class="tut"><div><b class="e">🗺️</b><span><b>20 houses</b> to restore — from a cottage to a castle, a moon base and a sky island. Finish one to unlock the next.</span></div><div><b class="e">🔨</b><span>Each place is a wreck! Tap the <b>hammer spots</b> to fix it up.</span></div><div><b class="e">✨</b><span>Then tap the <b>sparkle spots</b> to decorate. Every item has <b>3 styles</b> — fancier ones cost more but earn ⭐.</span></div><div><b class="e">🫧</b><span>Earn tokens in <b>Squishi Merge</b>: tap SQUISH!, then drag two matching squishies together.</span></div><div><b class="e">🎉</b><span>Every 5 merges = <b>FUN ROUND</b>: smoosh ANY two squishies into something ridiculous!</span></div></div><button class="btn" data-closemodal>Let's go! 🚀</button>`)}
document.addEventListener('click',e=>{const t=e.target;
  const g=t.closest('[data-go]');if(g){closeModal();if(g.dataset.go==='house'&&view==='area'){go('house');return}go(g.dataset.go);return}
  const nb=t.closest('nav button');if(nb){go(nb.dataset.v);return}
  const hc=t.closest('.card[data-house]');if(hc){const hi=+hc.dataset.house;if(!houseUnlocked(hi)){toast(`🔒 Restore the ${HOUSES[hi-1].name} first!`);sfx.err();return}curH=hi;go('house');return}
  const ac2=t.closest('.card[data-area]');if(ac2){const ai=+ac2.dataset.area;if(!areaUnlocked(curH,ai)){toast(`🔒 Finish the repairs in the ${HOUSES[curH].areas[ai-1].name} first!`);sfx.err();return}curA=ai;go('area');return}
  if(t.closest('#tok')){go('merge');return}
  if(t.closest('#snd')){S.muted=!S.muted;save();$('#snd').textContent=S.muted?'🔇':'🔊';return}
  if(view==='area'&&!t.closest('#sheet')){const k=t.closest('#v-area [data-k]');if(k&&!k.disabled){openSheet(k.dataset.k);return}}
  if(t.closest('#sheet')){if(t.closest('[data-close]')||t.id==='sheet'){closeSheet();return}const o=t.closest('.opt[data-i]');if(o){choose(+o.dataset.i);return}}
  if(t.closest('#squishBtn')){spawn();return}
  if(t.closest('#squashBtn')){squash();return}
  const cm=t.closest('[data-closemodal]');if(cm){closeModal();if(cm.dataset.nexthouse){curH=+cm.dataset.nexthouse;go('house');return}if(view==='merge')renderBoard();else render();return}
  if(t.closest('#modal')){const pk=t.closest('[data-pk]');if(pk){const i=funPick[0]?1:0;funPick[i]=pk.dataset.pk;sfx.pop();renderFun();return}
    const sl=t.closest('[data-slot]');if(sl){funPick[+sl.dataset.slot]=null;renderFun();return}
    if(t.closest('#funRand')){funPick=[rnd(S.disc),rnd(S.disc)];sfx.pop();renderFun();return}
    if(t.closest('#funGo')&&funPick[0]&&funPick[1]){smoosh();return}}
  const tg=t.closest('[data-fam]');if(tg){const f=tg.dataset.fam;if(S.act.includes(f)){if(S.act.length<=2){toast('Keep at least 2 families in the mix!');return}S.act=S.act.filter(x=>x!==f)}else{if(S.act.length>=5){toast('Max 5 families — remove one first.');return}S.act.push(f)}save();renderDex();return}
  if(t.closest('#tutBtn')){tutorial();return}
  const rb=t.closest('#resetBtn');if(rb){if(rb.dataset.armed){S=fresh();S.tut=true;save();toast('Fresh start! 🏚️');go('map')}else{rb.dataset.armed=1;rb.textContent='⚠️ Tap again to erase everything';setTimeout(()=>{if(rb.isConnected){delete rb.dataset.armed;rb.textContent='🗑️ Start over'}},3500)}return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
$('#snd').textContent=S.muted?'🔇':'🔊';
go('map');
if(!S.tut){S.tut=true;save();tutorial()}

</script>
</body>
</html>
